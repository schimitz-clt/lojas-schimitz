services:
  postgres:
    image: postgres:16-alpine
    container_name: schimitz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: schimitz
      POSTGRES_PASSWORD: schimitz
      POSTGRES_DB: lojas_schimitz
    ports:
      - "5432:5432"
    volumes:
      - schimitz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schimitz -d lojas_schimitz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schimitz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - schimitz_redis:/data

volumes:
  schimitz_pg:
  schimitz_redis:
