<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lojas Schimitz — sem conexão</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1A1A1A; color: #F5F5F5; padding: 24px; box-sizing: border-box;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      border: 1px solid #333; border-radius: 16px; padding: 28px 22px;
      background: #222;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 12px;
      background: #D4AF37; color: #1A1A1A; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #BDBDBD; line-height: 1.45; font-size: 0.95rem; }
    button {
      appearance: none; border: 0; border-radius: 999px; padding: 12px 22px;
      background: #D4AF37; color: #1A1A1A; font-weight: 700; font-size: 1rem;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">LS</div>
    <h1>Sem conexão</h1>
    <p>Não foi possível carregar a Lojas Schimitz. Verifique a internet e tente de novo.</p>
    <button type="button" onclick="window.LojasSchimitz && window.LojasSchimitz.retry()">Tentar novamente</button>
    <p class="hint">lojasschimitz.com.br</p>
  </div>
</body>
</html>
